@if (memberService.member(); as member) {
    <div class="flex gap-6 mb-6">
        <div class="card bg-base-300 flex flex-col w-1/4 rounded-2xl">
            <img src="{{member.imageUrl || '/avatar.png'}}" alt="Member Image" class="rounded-2xl mx-10 mt-10 object-cover">
            <div class="card-body">
                <div class="flex flex-col items-center text-center">
                    <div class="flex text-3xl text-primary ">{{member.userName}}, {{member.dob | age}}</div>
                    <div class="text-sm text-info"> {{member.city}}, {{member.country}}.</div>
                </div>
                <div class="divider"></div>
                <ul class="menu rounded-box w-full text-xl gap-3 cursor-pointer">
                    <li> <a routerLink="profile" routerLinkActive="text-primary">Profile</a></li>
                    <li> <a routerLink="photos" routerLinkActive="text-primary">Photos</a></li>
                    <li> <a routerLink="messages" routerLinkActive="text-primary">Messages</a></li>
                </ul>
                <div class="card-actions justify-evenly mt-5 gap-5">
                    <button class="btn btn-primary btn-lg flex-1 shadow-lg transition duration-200">
                        <a href="/"  (click)="goBack()">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                            </svg>
                        </a>
                    </button>
                    <button class="btn btn-success btn-lg flex-1 shadow-lg transition duration-200">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6.633 10.25c.806 0 1.533-.446 2.031-1.08a9.041 9.041 0 0 1 2.861-2.4c.723-.384 1.35-.956 1.653-1.715a4.498 4.498 0 0 0 .322-1.672V2.75a.75.75 0 0 1 .75-.75 2.25 2.25 0 0 1 2.25 2.25c0 1.152-.26 2.243-.723 3.218-.266.558.107 1.282.725 1.282m0 0h3.126c1.026 0 1.945.694 2.054 1.715.045.422.068.85.068 1.285a11.95 11.95 0 0 1-2.649 7.521c-.388.482-.987.729-1.605.729H13.48c-.483 0-.964-.078-1.423-.23l-3.114-1.04a4.501 4.501 0 0 0-1.423-.23H5.904m10.598-9.75H14.25M5.904 18.5c.083.205.173.405.27.602.197.4-.078.898-.523.898h-.908c-.889 0-1.713-.518-1.972-1.368a12 12 0 0 1-.521-3.507c0-1.553.295-3.036.831-4.398C3.387 9.953 4.167 9.5 5 9.5h1.053c.472 0 .745.556.5.96a8.958 8.958 0 0 0-1.302 4.665c0 1.194.232 2.333.654 3.375Z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="card bg-base-300 rounded-2xl w-3/4 p-8">
            <div class="flex justify-between items-center">
                <h3 class="card-title text-3xl text-primary">{{member.userName}}'s {{title()}},</h3>
                @if (isCurrentUser()) {
                    <button class="btn btn-outline btn-primary" 
                        (click)="memberService.editMode.set(!memberService.editMode())">
                        {{memberService.editMode() ? 'Cancel' : 'Edit'}}
                    </button>
                }
            </div>
            <div class="divider"></div>
            <div class="">
                <router-outlet/>
            </div>
        </div>
    </div>
} @else {
    <p>Member Not Found.</p>
}
