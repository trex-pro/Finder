@if (memberService.member(); as member) {
    <div class="flex flex-col gap-3">
        @if (memberService.editMode()) {
            <form #editFrom="ngForm" (ngSubmit)="updatedProfile()" class="flex flex-col w-full gap-4">
                <label class="floating-label"><span>User Name</span>
                    <input class="input w-full" name="UserName" placeholder="User Name" [(ngModel)]="editableMember.userName">
                </label>
                <label class="floating-label"><span>Description</span>
                    <textarea class="textarea w-full" name="Description" placeholder="Description" [(ngModel)]="editableMember.description"></textarea>
                </label>
                <label class="floating-label"><span>City</span>
                    <input class="input w-full" name="City" placeholder="City" [(ngModel)]="editableMember.city">
                </label>
                <label class="floating-label"><span>Country</span>
                    <input class="input w-full" name="Country" placeholder="Country" [(ngModel)]="editableMember.country">
                </label>
                <div class="flex self-end">
                    <button type="submit" class="btn btn-success">Submit</button>
                </div>
            </form>
        } @else {
            <div>{{member.description}}</div>
        }
        <h3 class="text-xl text-info">Timeline</h3>
        <div class="flex gap-1">
            <div class="font-semibold"> Last Active On: </div>
            <span>{{member.lastActive | date: 'medium'}}</span>
        </div>
        <div class="flex gap-1">
            <div class="font-semibold">Member Since: </div>
            <span>{{member.created | date: 'longDate'}}</span>
        </div>
    </div>
}
